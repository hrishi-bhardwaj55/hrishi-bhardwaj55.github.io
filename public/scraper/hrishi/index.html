  [Object.values(s.blocked || {}).reduce((a, b) => a + b, 0), "hidden: work authorization / experience"],
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

$("resume").innerHTML = `<option value="">Best resume</option>` +
  DATA.resumes.map(r => `<option value="${esc(r)}">Score by ${esc(r)}</option>`).join("");
[...new Set(DATA.jobs.map(j => j.source))].sort().forEach(src =>
  $("source").insertAdjacentHTML("beforeend", `<option>${esc(src)}</option>`));

const prefs = (() => { try { return JSON.parse(localStorage.getItem("prefs") || "{}"); } catch { return {}; } })();
for (const k of ["resume", "source", "sort"]) if (prefs[k] != null) $(k).value = prefs[k];
for (const k of ["remote", "all", "sponsor"]) if (prefs[k] != null) $(k).checked = prefs[k];
let view = prefs.view === "watch" ? "watch" : "all", pick = "";
const watchJobs = DATA.jobs.filter(j => j.tags.includes("watchlist"));
$("n-all").textContent = DATA.jobs.length;
$("n-watch").textContent = watchJobs.length;
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; pick = ""; render(); }));

function renderWatchTable() {
  const rows = [...(DATA.watchlist || [])].sort((a, b) => (b.count - a.count) || a.name.localeCompare(b.name));
  $("wl-body").innerHTML = rows.map(w => `<tr class="${w.count ? "pick" : ""} ${pick === w.name ? "sel" : ""}" data-name="${esc(w.name)}">
      <td><b>${esc(w.name)}</b></td>
      <td class="n ${w.count ? "" : "zero"}">${w.count || "&ndash;"}</td>
      <td class="note">${esc(w.note)}</td>
      <td>${w.careers_url ? `<a class="site" href="${esc(safeUrl(w.careers_url))}" target="_blank" rel="noopener">Open careers &rarr;</a>` : ""}</td>
    </tr>`).join("");
  $("wl-body").querySelectorAll("tr.pick").forEach(tr => tr.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    pick = pick === tr.dataset.name ? "" : tr.dataset.name;
    render();
  }));
}

const cls = v => v >= DATA.strong_score ? "hi" : v >= DATA.min_score ? "mid" : "lo";
const ago = iso => {
  if (!iso) return "";
  const h = Math.round((Date.now() - new Date(iso)) / 36e5);
  return h < 1 ? "just now" : h < 24 ? `${h}h ago` : new Date(iso).toLocaleDateString();
};

function render() {
  const q = $("q").value.toLowerCase().trim(), r = $("resume").value, src = $("source").value;
  const remote = $("remote").checked, all = $("all").checked, sort = $("sort").value, sp = $("sponsor").checked;
  const wl = view === "watch";
  try { localStorage.setItem("prefs", JSON.stringify({resume: r, source: src, sort, remote, all, sponsor: sp, view})); } catch {}
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  $("wl-panel").hidden = !wl;
  if (wl) renderWatchTable();
  const sc = j => r ? (j.scores[r] ?? 0) : j.score;
  let rows = DATA.jobs.filter(j =>
    (wl || all || sc(j) >= DATA.min_score) && (!remote || j.remote) && (!src || j.source === src) &&
    (!sp || j.tags.includes("sponsors")) && (!wl || j.tags.includes("watchlist")) && (!pick || j.watch_company === pick) &&
    (!q || `${j.title} ${j.company} ${j.location} ${j.matched_skills.join(" ")}`.toLowerCase().includes(q)));
  rows.sort(sort === "posted" ? (a, b) => (b.posted_at || "").localeCompare(a.posted_at || "")
          : sort === "company" ? (a, b) => a.company.localeCompare(b.company)
          : (a, b) => sc(b) - sc(a));
  $("count").innerHTML = `${rows.length} job${rows.length === 1 ? "" : "s"}` +
    (wl ? (pick ? ` at ${esc(pick)} <button class="wl-reset" id="wl-reset">show all watchlist</button>` : " at watchlist companies") : "");
  if ($("wl-reset")) $("wl-reset").onclick = () => { pick = ""; render(); };
  $("list").innerHTML = rows.length ? rows.map(j => {
    const v = sc(j), other = Object.entries(j.scores).map(([k, x]) => `${esc(k)} ${Math.round(x)}`).join(" · ");
    return `<article class="job">
      <div class="score ${cls(v)}" title="${other}">${Math.round(v)}</div>
      <div>
        <p class="title"><a href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">${esc(j.title)}</a></p>
        <div class="meta">${esc(j.company)} · ${esc(j.location)} · ${ago(j.posted_at)}</div>
        <div class="chips">
          <span class="chip resume">${esc(r || j.best_resume)} resume</span>
          <span class="chip">${other}</span>
          ${j.tags.includes("sponsors") ? `<span class="chip sponsor">Sponsors visa</span>` : ""}
          ${j.watch_note ? `<span class="chip watch" title="${esc(j.watch_note)}">★ Watchlist · ${esc(j.watch_note.split(";")[0].slice(0, 60))}</span>` : ""}
          ${j.years_required != null ? `<span class="chip">${j.years_required}+ yrs</span>` : ""}
          ${/\b(java|spring|jvm|kotlin)\b/i.test(j.title + " " + j.description) ? `<span class="chip">Java</span>` : ""}
          ${j.remote ? `<span class="chip">Remote</span>` : ""}
          <span class="chip">${esc(j.source)}</span>
          ${j.matched_skills.slice(0, 6).map(k => `<span class="chip">${esc(k)}</span>`).join("")}
        </div>
        <div class="desc">${esc(j.description)}…</div>
        <button class="more" onclick="this.closest('.job').classList.toggle('open')">Details</button>
      </div>
      <div class="actions"><a class="apply" href="${esc(safeUrl(j.apply_url))}" target="_blank" rel="noopener">Apply →</a></div>
    </article>`;
  }).join("") : `<div class="empty">${wl ? "No watchlist-company jobs passed your filters in this scan. Use \u201cOpen careers\u201d above to browse them directly."
                                        : "No jobs match these filters yet. Try \u201cShow low matches\u201d."}</div>`;
}
["q", "resume", "source", "sort", "remote", "all", "sponsor"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
