if(c.h1b==="yes"){yes+=card(c,jobs);ny++}else{unk+=card(c,jobs);nu++}}
document.getElementById("out").innerHTML=`<h3>Sponsors H-1B (${ny})</h3>${yes||'<p class="sub">None match.</p>'}`+(nu?`<h3>No H-1B evidence found (${nu})</h3>${unk}`:"")}
for(const id of["q","newonly","urg"])document.getElementById(id).addEventListener("input",render);render();
</script></body></html>
