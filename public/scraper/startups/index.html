function card(c,jobs){return `<div class="co"><h2>${esc(c.name)}${c.h1b==="yes"?'<span class="chip y">H-1B</span>':""}${c.new?`<span class="chip n">${c.new} new</span>`:""}${c.urgent?`<span class="chip u">immediate start</span>`:""}</h2>

<div class="sub">${c.evidence?esc(c.evidence):"No H-1B filings found"}${c.h1b_url?` · <a href="${esc(c.h1b_url)}" target="_blank" rel="noopener">LCA records</a>`:""}</div>
<ul>${jobs.map(j=>`<li><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a> <span class="sub">${esc(j.location)} · ${ago(j.posted_at)}</span>${j.new?'<span class="chip n">new</span>':""}${j.urgent?`<span class="chip u">${esc(j.urgent)}</span>`:""}${j.sponsors_text?'<span class="chip y">sponsors</span>':""}</li>`).join("")}</ul></div>`}
function render(){const q=document.getElementById("q").value.toLowerCase(),no=document.getElementById("newonly").checked,ur=document.getElementById("urg").checked;
let yes="",unk="",ny=0,nu=0;for(const c of DATA){const jobs=c.jobs.filter(j=>(!no||j.new)&&(!ur||j.urgent)&&(!q||`${c.name} ${j.title} ${j.location}`.toLowerCase().includes(q)));if(!jobs.length)continue;
