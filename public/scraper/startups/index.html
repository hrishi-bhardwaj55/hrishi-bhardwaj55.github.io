function card(c,jobs){return `<div class="co"><h2>${esc(c.name)}${c.h1b==="yes"?'<span class="chip y">H-1B</span>':""}${c.new?`<span class="chip n">${c.new} new</span>`:""}${c.urgent?`<span class="chip u">immediate start</span>`:""}</h2>
